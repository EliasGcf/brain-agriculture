# fly.toml app configuration file generated for brain-agriculture-as1r3a on 2026-09-16T03:44:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'brain-agriculture-as1r3a'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'bluegreen'

[http_service]
  internal_port = 3333
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
